name: crag-fastapi-ci

on:
  push:
    branches: [ci]

jobs:
  crag-fastapi-ci-pipeline:
    runs-on: ubuntu-latest

    services:
      crag_db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_crag_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d test_crag_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 3
          --health-start-period 10s

    env:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest