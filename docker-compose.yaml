services:
  crag_fastapi:
    build: .
    image: charlie125/crag_fastapi:1.0
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_HOST=crag_db
      - POSTGRES_PORT=5432
    depends_on:
      ingest_vector_db:
        condition: service_completed_successfully
      ollama_pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_llm:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 10s

  ollama_pull:
    image: ollama/ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:1b && ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  crag_db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 10s

  migration_db:
    image: charlie125/crag_fastapi:1.0
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=crag_db
      - POSTGRES_PORT=5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      crag_db:
        condition: service_healthy

  ingest_vector_db:
    image: charlie125/crag_fastapi:1.0
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_HOST=crag_db
      - POSTGRES_PORT=5432
    command: ["python", "vector_store.py"]
    depends_on:
      ollama_pull:
        condition: service_completed_successfully
      migration_db:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama_llm: